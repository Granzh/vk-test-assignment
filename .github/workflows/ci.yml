name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet and staticcheck
        run: make lint
      - name: Generated code is up to date
        run: |
          make sqlc
          git diff --exit-code -- internal/storage/db || {
            echo "internal/storage/db is stale: run 'make sqlc' and commit the result"; exit 1; }
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Test (race, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # storagetest creates a throw-away database per test on this server
      TEST_DATABASE_URL: postgres://bot:bot@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: bot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production compose file is valid
        run: |
          printf 'BOT_TOKEN=1:x\nPOSTGRES_PASSWORD=ci\n' > /tmp/ci.env
          docker compose -f docker-compose.prod.yml --env-file /tmp/ci.env config -q
          docker compose -f docker-compose.yml config -q
